# Builds an unsigned Jarvis.ipa on GitHub's Mac machines, so you never need a Mac yourself.
# Download it from the run's "Artifacts" section, then install it with Sideloadly on Windows,
# which signs it with your Apple ID.
name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # MLX needs Swift 6.3 tools, which ship with newer Xcode than the macos-15 image has.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode and Swift versions
        run: xcodebuild -version && swift --version

      - name: Install Metal toolchain (needed by MLX)
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen

      - name: Build (unsigned)
        run: |
          xcodebuild -project Jarvis.xcodeproj -scheme Jarvis -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Jarvis.app Payload/
          zip -qr Jarvis.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-ipa
          path: Jarvis.ipa
