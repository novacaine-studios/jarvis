# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Jarvis
options:
  bundleIdPrefix: com.novacainestudios
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # set to your Apple team ID, or pick it in Xcode > Signing
packages:
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.32.3
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  Jarvis:
    type: application
    platform: iOS
    sources: [Jarvis]
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: Jarvis/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: Jarvis looks through the camera when you ask what you're looking at.
        NSMicrophoneUsageDescription: Jarvis listens for "Hey Jarvis" and your question.
        NSSpeechRecognitionUsageDescription: Jarvis turns your speech into text on the device.
        NSRemindersFullAccessUsageDescription: Jarvis adds reminders when you ask it to.
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
